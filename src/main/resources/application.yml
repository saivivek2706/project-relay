spring:
  application:
    name: project-relay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_relay}
    username: ${DB_USERNAME:relay}
    password: ${DB_PASSWORD:relay_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: relay
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

layering:
  min-hops: 3
  max-hops: 6
  max-hop-gap: PT30M
  window: PT2H
  min-amount: 100000.00
  min-hop-retention: 0.9000
  min-end-to-end-retention: 0.7500
  max-expansions: 5000
  store: ${LAYERING_STORE:memory}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
